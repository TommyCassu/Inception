services:
  mariadb:
    container_name: mariadb
    image: mariadb
    secrets:
      - db_password
      - db_root_password
    build:
      context: ./requirements/mariadb
      dockerfile: Dockerfile
    networks:
      - inception
    env_file:
      - .env
    volumes:
      - mariadb:/var/lib/mysql
    restart: unless-stopped
    expose:
      - "3306"

  wordpress:
    container_name: wordpress
    image: wordpress
    secrets:
      - db_password
      - wp_admin_password
      - wp_sc_usr_password
    build:
      context: ./requirements/wordpress
      dockerfile: Dockerfile
    networks:
      - inception
    env_file:
      - .env
    volumes:
      - wordpress:/var/www/html
    depends_on:
      - mariadb
    restart: unless-stopped
    expose:
      - "9000"
  nginx:
    container_name: nginx
    image: nginx
    build:
      context: ./requirements/nginx
      dockerfile: Dockerfile
    networks:
      - inception
    env_file:
      - .env
    ports:
      - "443:443"
    volumes:
      - wordpress:/var/www/html
    depends_on:
      - wordpress
    restart: unless-stopped

volumes:
  mariadb:
    driver: local
    driver_opts:
      type: none 
      o: bind 
      device: /home/tcassu/data/mariadb	
  wordpress:
    driver: local
    driver_opts:
      type: none 
      o: bind 
      device: /home/tcassu/data/wordpress	


networks:
  inception:
    driver: bridge


secrets:
  db_password:
    file: ../secrets/db_password.txt
  db_root_password:
    file: ../secrets/db_root_password.txt
  wp_admin_password:
    file: ../secrets/wp_admin_password.txt
  wp_sc_usr_password:
    file: ../secrets/wp_sc_usr_password.txt